        /* LEARN — information / symbol / rule, compact vertical card */
        #learn {
          margin: 0;
        }
        .card {
          height: 440px !important;
          min-height: 0 !important;
          margin: 0 !important;
          padding: 0px !important;

          grid-template-columns: 1fr !important;
          grid-template-rows: repeat(3, minmax(0, 1fr)) !important;
          gap: 4px !important;
          overflow: hidden;

          width: 100% !important;
          margin: 4px 0 0 !important;
          padding: 8px 5px 10px !important;
          display: grid !important;
          grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
          grid-auto-rows: 46px;
          gap: 4px !important;
          justify-content: stretch !important;
          align-content: start;
          overflow: hidden;
          background: #fff;
          border-radius: var(--radius);
        }

        #choices,
        #gameChoices {
          height: 214px;
          touch-action: pan-y;
          user-select: none;
          margin-top: 14px !important;
        }

        #choicePageInfo,
        #gameChoicePageInfo {
          height: 24px;
          margin: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 13px;
          line-height: 1;
        }

        #choices button,
        #gameChoices button {
          width: 100% !important;
          min-width: 0 !important;
          height: 46px !important;
          margin: 0 !important;
          padding: 0 2px !important;
          border-radius: 8px;
          font-size: 25px !important;
          line-height: 1 !important;
        }

        /* GAME — difficulty row, information card, answer keyboard */
        .gameHeader {
          min-height: 34px;
          margin: 0 0 4px !important;
          display: grid;
          grid-template-columns: 1fr auto;
          align-items: center;
          gap: 4px;
        }
        #gameTitle {
          margin: 0 !important;
          font-size: 15px;
          text-align: left;
          padding-left: 4px;
        }
        .difficultyBox {
          position: static !important;
          transform: none !important;
          display: flex !important;
          gap: 3px !important;
        }
        .difficultyBox button {
          min-width: 0 !important;
          width: 48px;
          height: 28px;
          margin: 0 !important;
          padding: 0 !important;
          font-size: 11px !important;
        }
        .difficultyBox button.active {
          outline-width: 2px !important;
          transform: none !important;
        }
        .gameCard {
          height: 142px !important;
          margin: 0 !important;
          padding: 4px !important;
          display: grid !important;
          grid-template-columns: 1fr 1fr !important;
          grid-template-rows: 94px 40px !important;
          gap: 4px !important;
          overflow: hidden;
        }
        .gameInfo,
        .gameImageBox {
          width: 100% !important;
          height: 100% !important;
          padding: 5px !important;
          border-radius: 8px;
          background: #fafafa;
          font-size: 14px !important;
          line-height: 1.35 !important;
          text-align: center !important;
          align-items: center !important;
          overflow: hidden;
        }
        .gamePrompt {
          font-size: 12px !important;
          line-height: 1.35 !important;
        }
        .gameProgress {
          grid-column: 1 / -1;
          width: 100% !important;
          height: 80px !important;
          display: grid !important;
          grid-template-columns: 1fr 72px 74px;
          align-items: center !important;
          gap: 5px;
          font-size: 12px !important;
        }
        .progressBox {
          width: 100% !important;
          height: 10px;
          margin: 0 !important;
        }
        #gameProgressText {
          margin: 0 !important;
          font-size: 11px;
        }
        #showResult {
          min-width: 0 !important;
          height: 30px;
          margin: 0 !important;
          padding: 0 4px !important;
          font-size: 11px !important;
        }
        #gameChoices {
          height: 214px;
        }

        /* RESULT — one-column, readable and scrollable on phone */
        #resultView {
          margin: 0 !important;
          padding: 8px !important;
          max-height: calc(100dvh - 34px);
          overflow-y: auto;
        }
        #resultView h2 {
          margin: 0 0 8px !important;
          font-size: 17px;
        }
        .resultPlotWrap {
          width: 100%;
          display: grid !important;
          grid-template-columns: 1fr 1fr !important;
          gap: 6px !important;
        }
        #resultCanvas {
          grid-column: 1 / -1;
          grid-row: 1;
          width: min(100%, 300px) !important;
          height: auto !important;
          aspect-ratio: 1 / 1;
          justify-self: center;
        }
        .sideSymbol {
          min-height: 52px;
        }
        #responseSymbol,
        #stimulusSymbol {
          font-size: 42px !important;
        }
        .analysisSide {
          width: 100% !important;
          height: auto !important;
          max-height: 220px;
          padding: 10px !important;
          font-size: 12px !important;
          overflow-y: auto;
        }
        #analysisLeft {
          grid-column: 1 / -1;
        }
        #analysisRight {
          grid-column: 1 / -1;
        }
        #r2Text {
          font-size: 18px !important;
          margin: 8px 0 !important;
        }
        #downloadResult,
        #analyzeResult,
        #restartGame {
          min-width: 0 !important;
          margin: 3px !important;
          padding: 8px 10px !important;
          font-size: 12px !important;
        }

        button {
          touch-action: manipulation;
        }
      }

      /* =========================================================
         MOBILE SETUP — 2 STEP PAGES
         ========================================================= */

      @media (max-width: 768px) {
        #mobileSetup {
          width: 100%;
          height: calc(100dvh - 8px);
        }

        .setupPage {
          width: 100%;
          height: 100%;
          padding: 28px 16px 18px;

          display: flex;
          flex-direction: column;
          align-items: center;

          background: #f3f1ef;
        }

        .setupPage[hidden] {
          display: none !important;
        }

        .setupPage h1 {
          width: 100%;
          margin: 18px 0 42px;

          text-align: center;
          font-size: 22px;
          line-height: 1.2;
        }

        .setupInstruction {
          width: 100%;
          margin: 0 0 16px;

          font-size: 14px;
          font-weight: 600;
          line-height: 1.6;
          text-align: center;
          white-space: nowrap;
        }

        .setupGroupTitle,
        .selectedCategoryLabel {
          width: 184px;
          margin: 0 0 12px;

          font-size: 14px;
          font-weight: 600;
          text-align: left;
        }

        .setupChoices {
          width: 100%;

          display: flex !important;
          flex-direction: column;
          gap: 8px !important;
        }

        .setupChoices button {
          width: min(86%, 320px) !important;
          height: auto !important;
          min-width: 0 !important;
          min-height: 56px !important;

          align-self: center;

          margin: 0 !important;
          padding: 7px 10px !important;

          border: 1.5px solid #777;
          border-radius: 10px;

          background: white;
          color: black;

          font-size: 19px !important;
          font-weight: 500;
        }

        .setupPage .category button.active,
        .setupPage .mode button.active {
          background: white;
          color: black;
        }

        .setupBack {
          width: auto !important;
          height: auto !important;
          min-width: 100px !important;
          min-height: 0 !important;

          align-self: center;

          margin: 16px 0 0 !important;
          padding: 7px 9px !important;

          font-size: 14px !important;
        }

        #studyHeader {
          width: 100%;
          height: 34px;

          grid-template-columns: 48px 1fr 48px;
          align-items: center;
          gap: 4px;

          margin-bottom: 4px;
        }

        #studyHeader:not([hidden]) {
          display: grid;
        }

        #studyHeader button {
          width: 48px;
          min-width: 0;
          height: 30px;
          margin: 0;
          padding: 0;
          font-size: 15px;
        }

        #studyHeaderTitle {
          text-align: center;
          font-size: 15px;
          font-weight: 700;
        }

        #mobileSetup:not([style*="display: none"]) ~ #studyHeader,
        #mobileSetup:not([style*="display: none"]) ~ #studyHeader ~ #learn,
        #mobileSetup:not([style*="display: none"]) ~ #studyHeader ~ #quiz,
        #mobileSetup:not([style*="display: none"]) ~ #studyHeader ~ #game,
        #mobileSetup:not([style*="display: none"]) ~ #studyHeader ~ #resultView {
          display: none;
        }
      }
      #setupModePage .difficultyRow {
        width: 82%;
        align-self: center;

        display: flex;
        gap: 6px;
      }

      #setupModePage .difficultyRow .difficultyBtn {
        flex: 1 1 0;

        width: auto !important;
        min-width: 0 !important;
        min-height: 40px !important;
        height: auto !important;

        margin: 0 !important;
        padding: 0 4px !important;

        font-size: 14px !important;
        font-weight: 500;
        white-space: nowrap;
      }

      #setupModePage .difficultyBtn.beginner {
        background: linear-gradient(145deg, #f3c59c, #b66a38, #e1a170);
        color: #2b1207;
      }

      #setupModePage .difficultyBtn.intermediate {
        background: linear-gradient(145deg, #f5f5f5, #b5b5b5, #ededed);
        color: #222;
      }

      #setupModePage .difficultyBtn.advanced {
        background: linear-gradient(145deg, #fff5b8, #cfa126, #ffe27a);
        color: #3d2a00;
      }
    </style>
  </head>

  <body>
    <!-- =============================================================================== -->
    <!-- 태국어 음절 구조 분류 -->
    <!-- =============================================================================== -->
    <!-- [1] 음절 자모 -->
    <!-- [1.1] 모음 구체형 -->
    <!-- [1.1.1] 일체형 -->
    <!-- [1.1.1-A] 무기호 독립형 -->
    <!-- - 초중 일체형(CV): ฤ(rue), ฦ(lue) -->
    <!-- - 중종 일체형(VC): ใ(ai), ไ(ai) -->
    <!-- [1.1.1-B] 기호 결합형 -->
    <!-- - 중종 일체형(VC): ำ(am), ัว -->
    <!-- [1.1.2] 조합형: 초성과 중성은 필수, 종성은 선택 -->
    <!-- [1.1.2-A] 초성 -->
    <!-- - 단순자음: ก- -->
    <!-- - 중복자음: กล- -->
    <!-- [1.1.2-B] 중성 -->
    <!-- [1.1.2-B-1] 부속 기호 -->
    <!-- - 선도형: เ- -->
    <!-- - 후속형: -า -->
    <!-- - 호위형: เ-า -->
    <!-- - 지상형: ิ, ี, ึ, ื -->
    <!-- - 지하형: ุ, ู -->
    <!-- - 지상호위형: เ ีย -->
    <!-- [1.1.2-B-2] 단독 기호 관절형: -ว-, -อ- -->
    <!-- [1.1.2-C] 종성 결합 형태 -->
    <!-- - 불가형: ะ -->
    <!-- - 양문형: กวน(kuan), นอน(non) -->
    <!-- - 선택형 / 단자음(이중모음): -ย, -ว -->
    <!-- - 선택형 / 단자음(진성자음): -ม -->
    <!-- [2] 중복 자음 수 -->
    <!-- - 초성 중복 자음 -->
    <!-- - 종성 중복 자음 -->
    <!-- [3] 모음 내재형 -->
    <!-- - o 실현형(경음절): คน(kon) / 무기호 관절형과 유사 -->
    <!-- - a 실현형(중음절): สนุก(sanuk), อร่อย(aroi), เจริญ(chareun) / 무기호 독립형과 유사 -->
    <!-- - a/o 실현형(경/중음절): ถนน(tanon) -->
    <!-- [4] 음절 부가 기호 -->
    <!-- - 종성 결합 기호(마이타이쿠): ั -->
    <!-- - 종성 결합 기호(마이한아캇): ั -->
    <!-- - 성조 기호(완나육, วรรณยุกต์): ่, ้, ๊, ๋ -->
    <!-- - 묵음 부호(탄타캇): ์ -->
    <!-- =============================================================================== -->

    <div class="wrap">
      <div id="mobileSetup">
        <!-- 1페이지: 초성 모양 선택 -->
        <section id="setupCategoryPage" class="setupPage">
          <h1>태국어 음절</h1>

          <div class="setupInstruction">초성을 선택하세요.</div>

          <div class="setupChoices category">
            <button id="patternBtn" type="button">공백</button>
            <button id="oangBtn" type="button">오앙</button>
            <button id="kokaiBtn" type="button">꼬까이</button>
          </div>
        </section>

        <!-- 2페이지: 모드 선택 -->
        <section id="setupModePage" class="setupPage" hidden>
          <h1>태국어 음절</h1>

          <div class="setupInstruction">
            <div id="selectedCategoryLabel">초성으로 공백을 선택하셨습니다.</div>
            <div>모드를 선택하세요.</div>
          </div>

          <div class="setupChoices mode">
            <button id="learnTab" type="button">학습</button>

            <button id="quizTab" type="button">퀴즈</button>

            <div id="quizDifficultyRow" class="difficultyRow" style="display: none">
              <button id="quizDifficultyBeginner" class="difficultyBtn beginner" type="button">초급</button>
              <button id="quizDifficultyIntermediate" class="difficultyBtn intermediate" type="button">중급</button>
              <button id="quizDifficultyAdvanced" class="difficultyBtn advanced" type="button">고급</button>
            </div>

            <button id="gameTab" type="button">게임</button>

            <div id="gameDifficultyRow" class="difficultyRow" style="display: none">
              <button id="gameDifficultyBeginner" class="difficultyBtn beginner" type="button">초급</button>
              <button id="gameDifficultyIntermediate" class="difficultyBtn intermediate" type="button">중급</button>
              <button id="gameDifficultyAdvanced" class="difficultyBtn advanced" type="button">고급</button>
            </div>
          </div>

          <button id="backToCategory" class="setupBack" type="button">← 이전</button>
        </section>
      </div>

      <div id="studyHeader" hidden>
        <button id="backToSetup" type="button">←</button>
        <div id="studyHeaderTitle">태국어 음절</div>
        <button id="speak" type="button">🔊</button>
      </div>
      <div id="learn">
        <div class="card">
          <div class="pronInfo">
            <p id="learnKorean"></p>
            <p id="learnRtgs"></p>
            <p id="learnIpa"></p>
          </div>

          <div id="syllableSymbol" class="syllableSymbol"></div>

          <div class="ruleInfo">
            <p id="learnFormation"></p>
            <p id="learnCoda"></p>
            <p id="learnOnset"></p>
            <p id="learnNote"></p>
          </div>
        </div>
        <div class="bottombar"><button id="prev">이전</button><button id="next">다음</button></div>
      </div>
      <div id="quiz" style="display: none">
        <h2 id="quizTitle"></h2>
        <div id="quizSymbol" class="symbol"></div>
        <div class="quizTop">
          <div class="quizPromptLeft">
            <p id="quizKorean"></p>
            <p id="quizRtgs"></p>
            <p id="quizIpa"></p>
          </div>

          <div class="quizPromptCenter">
            <p id="answerKorean"></p>
            <p id="answerRtgs"></p>
            <p id="answerIpa"></p>
          </div>

          <div class="quizSide">
            <button id="prevQuiz">이전</button>

            <div class="quizProgressBox">
              <div id="quizProgressBar"></div>
            </div>

            <button id="newQuiz">다음</button>
          </div>
        </div>

        <div id="choices"></div>
        <div id="choicePageInfo">1 / 1</div>
      </div>

      <div id="game" style="display: none">
        <h2 id="gameTitle"></h2>
        <div id="gameSymbol" class="symbol"></div>

        <div class="gameTop">
          <div class="gamePromptLeft">
            <p id="gameKorean"></p>
            <p id="gameRtgs"></p>
            <p id="gameIpa"></p>
          </div>

          <div class="gamePromptCenter">
            <p id="gameFormation"></p>
            <p id="gameCoda"></p>
            <p id="gameOnset"></p>
            <p id="gameNote"></p>
          </div>

          <div class="gameSide">
            <div class="progressBox">
              <div id="progressBar"></div>
            </div>

            <p id="gameProgressText"></p>
            <button id="showResult">결과 보기</button>
          </div>
        </div>

        <div id="gameChoices"></div>
        <div id="gameChoicePageInfo">1 / 1</div>
      </div>

      <div id="resultView" style="display: none">
        <h2>게임 결과</h2>

        <div class="resultPlotWrap">
          <div id="analysisLeft" class="analysisSide" style="display: none"></div>

          <div class="sideSymbol">
            <div class="sideTitle">자극:</div>
            <div id="stimulusSymbol"></div>
          </div>

          <canvas id="resultCanvas" width="700" height="700"></canvas>

          <div class="sideSymbol">
            <div class="sideTitle">반응:</div>
            <div id="responseSymbol"></div>
          </div>

          <div id="analysisRight" class="analysisSide" style="display: none"></div>
        </div>

        <p id="r2Text"></p>

        <button id="downloadResult">결과 저장</button>
        <button id="analyzeResult">결과 분석</button>
        <button id="restartGame">게임 다시</button>

        <div id="reportView" style="display: none">
          <h2>분석 보고서</h2>
          <div id="reportMeta"></div>
          <canvas id="reportCanvas" width="700" height="700"></canvas>
          <pre id="reportDiagnosis"></pre>
          <pre id="reportStrategy"></pre>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="gameAnalysis_syllable.js"></script>
    <script src="app_syllable.js"></script>
  </body>
</html>
