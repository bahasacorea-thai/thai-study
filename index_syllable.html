              font-size: 96px;

        overflow: hidden;
        background: #eee;

      }

      }

      #gameProgressText {

      }

      #gameTitle {

      }

      #beginnerBtn {

      #intermediateBtn {

      .analysisSide {
        width: 260px;

        overflow-y: auto;

        padding: 16px;

        white-space: pre-line;
        text-align: left;

        font-size: 14px;

      }

      .syllableSymbol,
      .gamePrompt,
      .quizPromptLeft,

        justify-content: center;
        text-align: center;
        white-space: pre-line;
      }

      .syllableSymbol,
      .gamePrompt {
        font-family: "Noto Sans Thai", "Tahoma", "Leelawadee UI", sans-serif;
      }

      .syllableSymbol {

        line-height: 1;
      }

      .syllableSymbolPanel {
        position: relative;
        width: 100%;
        height: 100%;

      }

      .syllableSymbolPanel .syllableSymbol {
        width: 100%;
        height: 100%;
      }

      .learnSideArrow {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 2;

        width: 30px;
        height: 100%;

        color: #111;

        font-weight: 100;
        line-height: 1;

        display: flex;
        align-items: center;
        justify-content: center;

      .learnSideArrowLeft {
        left: 0;
      }

      .learnSideArrowRight {
        right: 0;
      }

      .gamePrompt {
        font-size: 28px;
        line-height: 1.7;
        font-weight: 400;
      }

      .gamePrompt p {
        margin: 0;
      }

      .gamePromptLeft,
      .quizPromptCenter,
      .gamePromptCenter {

        padding: 18px;

        font-size: 32px;
        line-height: 1.7;

      }

      .quizPromptLeft p,
      .gamePromptLeft p,
      .quizPromptCenter p,
      .gamePromptCenter p {
        margin: 0;
      }

      #learnRtgs,
      #learnIpa,
      #gameIpa,
      #quizIpa,
      #result div div:nth-child(4) {
        font-family: "Doulos SIL", serif;
      }

      #quizNote {
        color: #555;
      }

      @media print {
        body * {
          visibility: hidden;
        }

        #reportView,
        #reportView * {
          visibility: visible;
        }

        #reportView {
          display: block;
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          background: white;
        }

        #reportCanvas {
          width: 160mm;
          height: 160mm;
          display: block;
          margin: 8mm auto;
        }

        #reportView h2,
        #reportMeta,
        #reportCanvas {
          page-break-after: avoid;
        }

        #reportDiagnosis,
        #reportStrategy {
          white-space: pre-wrap;
          font-size: 12pt;
          line-height: 1.45;
          page-break-before: auto;
        }

        #reportStrategy {
          page-break-before: always;
        }
      }

      @page {
        size: A4 portrait;
        margin: 12mm;
      }

      /* =========================================================
   MOBILE-ONLY UI — 320px baseline
   This application is designed exclusively for mobile use.
   Desktop viewport does not activate a separate layout.
   ========================================================= */
      :root {
        --app-w: 520px;
        --ui-gap: 4px;
        --radius: 10px;
        --control-h: 30px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        padding: 0;
        background: #f5f5f5;
        overflow-x: hidden;
        font-size: 13px;
      }

      .wrap {
        width: 100%;
        max-width: var(--app-w);
        min-height: 100dvh;
        margin: 0 auto;
        padding: max(6px, env(safe-area-inset-top)) 6px max(6px, env(safe-area-inset-bottom));
      }

      #studyHeader,
      #learn,
      #quiz,
      #game,
      #resultView {
        width: 100%;
        max-width: none;
        margin-left: 0;
        margin-right: 0;
      }

      .wrap > h1 {
        height: 26px;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        line-height: 1;
      }

      /* top controls: four compact rows, no PC wrapping behavior */
      .topbar {
        display: grid;
        grid-template-columns: 1fr;
        gap: 3px;
        margin: 0 0 4px;
      }

      .syllableSet,
      .topbar > div:last-child {
        width: 100%;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 3px;
      }

      .topbar button,
      .mode button,
      .category button,
      .syllableSet button,
      #speak {
        width: 100%;
        min-width: 0;
        height: var(--control-h);
        margin: 0;
        padding: 0 4px;
        border: 1px solid #777;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1;
        background: #fff;
      }
      .mode button.active {
        background: #e53935;
        color: #fff;
      }
      .category button.active {
        background: #4169e1;
        color: #fff;
      }
      .syllableSet button.active {
        background: #38d878;
        color: #111;
      }
      #speak {
        background: #fff;
      }

      /* common white mobile panels */
      .card,
      .quizTop,
      .gameTop,
      #resultView {
        border-radius: var(--radius);
        background: #fff;
        box-shadow: none;
      }

      /* LEARN — information / symbol / rule, compact vertical card */
      #learn {
        margin: 0;
      }

      .card {
        height: calc(100dvh - 50px);
        min-height: 0;
        margin: 0;
        padding: 0px;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 4px;
        overflow: hidden;
        position: relative;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        background: #ddd;
        z-index: 2;
        pointer-events: none;
      }

      .card::before {
        top: calc((100% - 8px) / 3);
      }

      .card::after {
        bottom: calc((100% - 8px) / 3);
      }

      #learn .pronInfo,
      #learn .ruleInfo {
        width: 100%;
        height: 100%;
        padding: 0 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 16px;
        line-height: 1.6;
        overflow: hidden;
      }

      #learn .pronInfo p,
      #learn .ruleInfo p {
        margin: 0;
        line-height: inherit;
      }

      .syllableSymbol,
      .symbol {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(69.6px, 28.8vw, 98.4px);
        line-height: 1.2;
        overflow: visible;
      }
      .bottombar {
        height: 42px;
        margin: 4px 0 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .bottombar button {
        width: 100%;
        min-width: 0;
        height: 38px;
        margin: 0;
        padding: 0;
        font-size: 14px;
      }

      /* QUIZ — prompt card + swipeable 4×4 answer keyboard */
      #quiz,
      #game {
        height: calc(100dvh - 50px);
        min-height: 0;
        margin: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: calc(var(--ui-gap) + var(--ui-gap));
      }

      .quizMain,
      .gameMain {
        min-height: 0;
        height: 100%;
        display: grid;
        grid-template-rows:
          minmax(0, 1fr)
          calc(var(--control-h) + var(--control-h))
          minmax(0, 2fr);
        gap: calc(var(--ui-gap) + var(--ui-gap));
        overflow: hidden;
      }

      #quizTitle,
      #gameTitle {
        min-height: var(--control-h);
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2px 6px;
        font-size: 13px;
        line-height: 1.2;
        text-align: center;
      }

      #quizSymbol,
      #gameSymbol {
        display: none;
      }

      .quizTop,
      .gameTop {
        min-height: 0;
        height: 100%;
        margin: 0;
        padding: calc(var(--ui-gap) + var(--ui-gap)) var(--ui-gap);
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(0, 1fr);
        column-gap: var(--ui-gap);
        overflow: hidden;
      }

      .quizPromptLeft,
      .gamePromptLeft,
      .quizPromptCenter,
      .gamePromptCenter {
        min-height: 0;
        height: 100%;
        padding: 5px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
        border-radius: 8px;
        background: #fafafa;
      }

      .quizSide,
      .gameSide {
        min-height: calc(var(--control-h) + var(--control-h));
        height: 100%;
        display: grid;
        grid-template-columns: 66px 1fr 66px;
        column-gap: var(--ui-gap);
        align-items: center;
        padding: 0 var(--ui-gap);
      }

      .gameSide .progressBox {
        grid-column: 1;
      }

      .gameSide .progressBox {
        height: 20px;
      }

      .gameSide #gameProgressText {
        grid-column: 2;
        text-align: center;
      }

      .gameSide #showResult {
        grid-column: 3;
      }

      #prevQuiz,
      #newQuiz {
        width: 66px;
        min-width: 0;
        height: 32px;
        margin: 0;
        padding: 0;
      }

      .quizProgressBox {
        width: 100%;
        height: 20px;
        margin: 0;
        background: #ddd;
        border-radius: 5px;
        overflow: hidden;
      }

      .quizKeyboard,
      .gameKeyboard {
        min-height: 0;
        height: 100%;
        display: grid;
        grid-template-rows: minmax(0, 1fr) max-content;
        gap: calc(var(--ui-gap) + var(--ui-gap));
        overflow: hidden;
      }

      #choices,
      #gameChoices,
      #choices.basic,
      #choices.additional,
      #choices.all,
      #gameChoices.basic,
      #gameChoices.additional,
      #gameChoices.all {
        width: 100%;
        min-height: 0;
        margin: 0;
        padding: calc(var(--ui-gap) + var(--ui-gap)) var(--ui-gap);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
        column-gap: var(--ui-gap);
        row-gap: calc(var(--ui-gap) + var(--ui-gap));
        justify-content: stretch;
        overflow: hidden;
        background: #fff;
        border-radius: var(--radius);
      }

      #choices,
      #gameChoices {
        min-height: 0;
        height: 100%;
        touch-action: pan-y;
        user-select: none;
        margin-top: 0;
      }

      #choicePageInfo,
      #gameChoicePageInfo {
        min-height: 0;
        height: auto;
        margin: 0;
        padding: calc(var(--ui-gap) + var(--ui-gap)) 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        line-height: 1;
      }

      #choices button,
      #gameChoices button {
        width: 100%;
        min-width: 0;
        min-height: 0;
        height: 100%;
        margin: 0;
        padding: 0 2px;
        border-radius: 8px;
        font-size: 25px;
        line-height: 1;
      }

      /* GAME — difficulty row, information card, answer keyboard */
      .gameHeader {
        min-height: 34px;
        margin: 0 0 4px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 4px;
      }
      #gameTitle {
        margin: 0;
        font-size: 15px;
        text-align: left;
        padding-left: 4px;
      }
      .difficultyBox {
        position: static;
        transform: none;
        display: flex;
        gap: 3px;
      }
      .difficultyBox button {
        min-width: 0;
        width: 48px;
        height: 28px;
        margin: 0;
        padding: 0;
        font-size: 11px;
      }
      .difficultyBox button.active {
        outline-width: 2px;
        transform: none;
      }
      .gameCard {
        height: 142px;
        margin: 0;
        padding: 4px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 94px 40px;
        gap: 4px;
        overflow: hidden;
      }
      .gameInfo,
      .gameImageBox {
        width: 100%;
        height: 100%;
        padding: 5px;
        border-radius: 8px;
        background: #fafafa;
        font-size: 14px;
        line-height: 1.35;
        text-align: center;
        align-items: center;
        overflow: hidden;
      }
      .gamePrompt {
        font-size: 12px;
        line-height: 1.35;
      }
      .gameProgress {
        grid-column: 1 / -1;
        width: 100%;
        height: 80px;
        display: grid;
        grid-template-columns: 1fr 72px 74px;
        align-items: center;
        gap: 5px;
        font-size: 12px;
      }
      .progressBox {
        width: 100%;
        height: 10px;
        margin: 0;
      }
      #gameProgressText {
        margin: 0;
        font-size: 11px;
      }
      #showResult {
        min-width: 0;
        height: 30px;
        margin: 0;
        padding: 0 4px;
        font-size: 11px;
      }

      /* RESULT — content / page indicator / fixed controls */
      #resultView {
        width: 100%;
        height: calc(100dvh - 50px);
        min-height: 0;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-rows:
          minmax(0, 1fr)
          var(--control-h)
          var(--control-h);
        gap: var(--ui-gap);
        overflow: hidden;
        align-items: stretch;
      }

      .resultPages {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
      }

      .resultPages::-webkit-scrollbar {
        display: none;
      }

      .resultPage {
        flex: 0 0 100%;
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 0;
        padding:
          calc(var(--ui-gap) + var(--ui-gap))
          calc(var(--ui-gap) + var(--ui-gap))
          calc(
            var(--control-h) +
            var(--control-h) +
            var(--ui-gap) +
            var(--ui-gap)
          );
        scroll-snap-align: start;
        scroll-snap-stop: always;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      .resultPage h2 {
        min-height: var(--control-h);
        margin: 0 0 var(--ui-gap);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }

      .resultPlotWrap {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: calc(var(--ui-gap) + var(--ui-gap));
      }

      #resultCanvas {
        grid-column: 1 / -1;
        grid-row: 1;
        width: min(100%, 300px);
        height: auto;
        aspect-ratio: 1 / 1;
        justify-self: center;
      }

      .sideSymbol {
        min-height: 52px;
      }

      #responseSymbol,
      #stimulusSymbol {
        font-size: 42px;
      }

      #r2Text {
        font-size: 18px;
        margin: calc(var(--ui-gap) + var(--ui-gap)) 0 0;
      }

      .resultAnalysisContent {
        width: 100%;
        display: block;
        text-align: left;
      }

      .analysisSide {
        width: 100%;
        height: auto;
        max-height: none;
        margin: 0 0 calc(var(--ui-gap) + var(--ui-gap));
        padding: 10px;
        overflow: visible;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-line;
      }

      #resultPageInfo {
        position: fixed;
        left: 50%;
        bottom: calc(
          max(6px, env(safe-area-inset-bottom)) +
          var(--control-h) +
          var(--ui-gap)
        );
        transform: translateX(-50%);
        z-index: 999;

        width: calc(100% - 12px);
        max-width: calc(var(--app-w) - 12px);
        height: var(--control-h);
        margin: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: white;
        font-size: 13px;
        line-height: 1;
        user-select: none;
        pointer-events: none;
      }

      .resultActions {
        position: fixed;
        left: 50%;
        bottom: max(6px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 1000;

        width: calc(100% - 12px);
        max-width: calc(var(--app-w) - 12px);
        height: var(--control-h);

        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--ui-gap);
      }

      #downloadResult,
      #analyzeResult,
      #restartGame {
        width: 100%;
        min-width: 0;
        height: var(--control-h);
        margin: 0;
        padding: 0 4px;
        font-size: 12px;
      }

      #analyzeResult:disabled {
        opacity: 0.4;
      }

      button {
        touch-action: manipulation;
      }

      /* =========================================================
   MOBILE SETUP — ENGLISH STRESS STRUCTURE와 동일
   ========================================================= */

      #mobileSetup {
        width: 100%;
        max-width: var(--app-w);
        height: 100dvh;
        margin: 0 auto;
        padding: max(6px, env(safe-area-inset-top)) 6px max(6px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 6px;
      }

      #mobileSetup > h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.1;
        text-align: center;
      }

      .setupPanel {
        background: white;
        border-radius: 16px;
        padding: 8px;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        overflow-y: auto;
        overflow-x: hidden;
      }

      #setupModePage {
        display: none;
      }

      body.setup-mode #setupCategoryPage {
        display: none;
      }

      body.setup-mode #setupModePage {
        display: flex;
      }

      .setupInstruction {
        width: 100%;
        margin: 0 auto 4px;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
      }

      #selectedCategoryLabel {
        margin: 0 auto 12px;
      }

      .setupChoices {
        width: min(57.33%, 213.33px);
        max-width: none;
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin: 0 auto;
      }

      .setupChoices > button {
        width: 100%;
        min-width: 0;
        min-height: 48px;
        margin: 0;
        padding: 7px 10px;
        font-size: 19px;
        font-weight: 500;
      }

      #setupModePage .difficultyRow {
        width: 143%;
        justify-self: center;
        align-self: center;
        display: none;
        gap: 6px;
      }

      #setupModePage .difficultyRow.show {
        display: flex;
      }

      #setupModePage .difficultyBtn {
        flex: 1 1 0;
        min-width: 0;
        width: auto;
        min-height: 40px;
        margin: 0;
        padding: 0 4px;
        font-size: 14px;
        white-space: nowrap;
      }

      #setupModePage .difficultyBtn.beginner {
        background: linear-gradient(145deg, #f3c59c, #b66a38, #e1a170);
        color: #2b1207;
      }

      #setupModePage .difficultyBtn.intermediate {
        background: linear-gradient(145deg, #f5f5f5, #b5b5b5, #ededed);
        color: #222;
      }

      #setupModePage .difficultyBtn.advanced {
        background: linear-gradient(145deg, #fff5b8, #cfa126, #ffe27a);
        color: #3d2a00;
      }

      .setupBack {
        align-self: center;
        min-width: 100px;
        width: auto;
        min-height: 0;
        margin: 16px 0 0;
        padding: 7px 9px;
        background: #eeeeee;
        font-size: 14px;
      }

      body.running #mobileSetup {
        display: none;
      }

      body:not(.running) .wrap {
        display: none;
      }

      #studyHeader {
        width: 100%;
        height: 34px;
        grid-template-columns: 48px 1fr 48px;
        align-items: center;
        gap: 4px;
        margin-bottom: 4px;
      }

      #studyHeader:not([hidden]) {
        display: grid;
      }

      #studyHeader button {
        width: 48px;
        min-width: 0;
        height: 30px;
        margin: 0;
        padding: 0;
        font-size: 15px;
      }

      #studyHeaderTitle {
        min-width: 0;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <!-- =============================================================================== -->
    <!-- 태국어 음절 구조 분류 -->
    <!-- =============================================================================== -->
    <!-- [1] 음절 자모 -->
    <!-- [1.1] 모음 구체형 -->
    <!-- [1.1.1] 일체형 -->
    <!-- [1.1.1-A] 무기호 독립형 -->
    <!-- - 초중 일체형(CV): ฤ(rue), ฦ(lue) -->
    <!-- - 중종 일체형(VC): ใ(ai), ไ(ai) -->
    <!-- [1.1.1-B] 기호 결합형 -->
    <!-- - 중종 일체형(VC): ำ(am), ัว -->
    <!-- [1.1.2] 조합형: 초성과 중성은 필수, 종성은 선택 -->
    <!-- [1.1.2-A] 초성 -->
    <!-- - 단자음: ก- -->
    <!-- - 자음군: กล- -->
    <!-- [1.1.2-B] 중성 -->
    <!-- [1.1.2-B-1] 부속 기호 -->
    <!-- - 전위형: เ- -->
    <!-- - 후위형: -า -->
    <!-- - 호위형: เ-า -->
    <!-- - 상위형: ิ, ี, ึ, ื -->
    <!-- - 하위형: ุ, ู -->
    <!-- [1.1.2-B-2] 단독 기호 관절형: -ว-, -อ- -->
    <!-- [1.1.2-C] 종성 결합 형태 -->
    <!-- - 불가형: ะ -->
    <!-- - 양문형: กวน(kuan), นอน(non) -->
    <!-- - 선택형 / 단자음(이중모음): -ย, -ว -->
    <!-- - 선택형 / 단자음(진성자음): -ม -->
    <!-- [2] 중복 자음 수 -->
    <!-- - 초성 중복 자음 -->
    <!-- - 종성 중복 자음 -->
    <!-- [3] 모음 내재형 -->
    <!-- - o 실현형(경음절): คน(kon) / 무기호 관절형과 유사 -->
    <!-- - a 실현형(중음절): สนุก(sanuk), อร่อย(aroi), เจริญ(chareun) / 무기호 독립형과 유사 -->
    <!-- - a/o 실현형(경/중음절): ถนน(tanon) -->
    <!-- [4] 음절 부가 기호 -->
    <!-- - 종성 결합 기호(마이타이쿠): ั -->
    <!-- - 종성 결합 기호(마이한아캇): ั -->
    <!-- - 성조 기호(완나육, วรรณยุกต์): ่, ้, ๊, ๋ -->
    <!-- - 묵음 부호(탄타캇): ์ -->
    <!-- =============================================================================== -->

    <div id="mobileSetup">
      <h1>태국어 음절</h1>

      <div id="setupCategoryPage" class="setupPanel">
        <div class="setupInstruction">초성을 선택하세요.</div>

        <div class="setupChoices category">
          <button id="patternBtn" type="button">공백</button>
          <button id="oangBtn" type="button">오앙</button>
          <button id="kokaiBtn" type="button">꼬까이</button>
        </div>
      </div>

      <div id="setupModePage" class="setupPanel">
        <div class="setupInstruction">
          <div id="selectedCategoryLabel">초성으로 공백을 선택하셨습니다.</div>
          <div>모드를 선택하세요.</div>
        </div>

        <div class="setupChoices mode">
          <button id="learnTab" type="button">학습</button>

          <button id="quizTab" type="button">퀴즈</button>

          <button id="gameTab" type="button">게임</button>

          <div id="gameDifficultyRow" class="difficultyRow">
            <button id="gameDifficultyBeginner" class="difficultyBtn beginner" type="button">초급</button>
            <button id="gameDifficultyIntermediate" class="difficultyBtn intermediate" type="button">중급</button>
            <button id="gameDifficultyAdvanced" class="difficultyBtn advanced" type="button">고급</button>
          </div>
        </div>

        <button id="backToCategory" class="setupBack" type="button">← 이전</button>
      </div>
    </div>

    <div class="wrap">
      <div id="studyHeader">
        <button id="backToSetup" type="button">←</button>
        <div id="studyHeaderTitle">태국어 음절</div>
        <button id="speak" type="button">🔊</button>
      </div>
      <div id="learn">
        <div class="card">
          <div class="pronInfo">
            <p id="learnKorean"></p>
            <p id="learnRtgs"></p>
            <p id="learnIpa"></p>
          </div>

          <div class="syllableSymbolPanel">
            <div class="learnSideArrow learnSideArrowLeft">‹</div>
            <div id="syllableSymbol" class="syllableSymbol"></div>
            <div class="learnSideArrow learnSideArrowRight">›</div>
          </div>

          <div class="ruleInfo">
            <p id="learnFormation"></p>
            <p id="learnCoda"></p>
            <p id="learnOnset"></p>
            <p id="learnNote"></p>
          </div>
        </div>
      </div>
      <div id="quiz" style="display: none">
        <h2 id="quizTitle"></h2>
        <div id="quizSymbol" class="symbol"></div>

        <div class="quizMain">
          <div class="quizTop">
            <div class="quizPromptLeft">
              <p id="quizKorean"></p>
              <p id="quizRtgs"></p>
              <p id="quizIpa"></p>
            </div>

            <div class="quizPromptCenter">
              <p id="answerKorean"></p>
              <p id="answerRtgs"></p>
              <p id="answerIpa"></p>
            </div>
          </div>

          <div class="quizSide">
            <button id="prevQuiz">이전</button>

            <div class="quizProgressBox">
              <div id="quizProgressBar"></div>
            </div>

            <button id="newQuiz">다음</button>
          </div>

          <div class="quizKeyboard">
            <div id="choices"></div>
            <div id="choicePageInfo">1 / 1</div>
          </div>
        </div>
      </div>

      <div id="game" style="display: none">
        <h2 id="gameTitle"></h2>
        <div id="gameSymbol" class="symbol"></div>

        <div class="gameMain">
          <div class="gameTop">
            <div class="gamePromptLeft">
              <p id="gameKorean"></p>
              <p id="gameRtgs"></p>
              <p id="gameIpa"></p>
            </div>

            <div class="gamePromptCenter">
              <p id="gameFormation"></p>
              <p id="gameCoda"></p>
              <p id="gameOnset"></p>
              <p id="gameNote"></p>
            </div>
          </div>

          <div class="gameSide">
            <div class="progressBox">
              <div id="progressBar"></div>
            </div>

            <p id="gameProgressText"></p>
            <button id="showResult">결과 보기</button>
          </div>

          <div class="gameKeyboard">
            <div id="gameChoices"></div>
            <div id="gameChoicePageInfo">1 / 1</div>
          </div>
        </div>
      </div>

      <div id="resultView" style="display: none">
        <div id="resultPages" class="resultPages">
          <section id="resultPlotPage" class="resultPage">
            <h2>게임 결과</h2>

            <div class="resultPlotWrap">
              <div class="sideSymbol">
                <div class="sideTitle">자극:</div>
                <div id="stimulusSymbol"></div>
              </div>

              <canvas id="resultCanvas" width="700" height="700"></canvas>

              <div class="sideSymbol">
                <div class="sideTitle">반응:</div>
                <div id="responseSymbol"></div>
              </div>
            </div>

            <p id="r2Text"></p>
          </section>

          <section id="resultAnalysisPage" class="resultPage">
            <h2>결과 분석 및 전략·대책</h2>

            <div class="resultAnalysisContent">
              <div id="analysisLeft" class="analysisSide"></div>
              <div id="analysisRight" class="analysisSide"></div>
            </div>
          </section>
        </div>

        <div id="resultPageInfo">1 / 2</div>

        <div class="resultActions">
          <button id="downloadResult">결과 저장</button>
          <button id="analyzeResult">결과 분석</button>
          <button id="restartGame">게임 다시</button>
        </div>
      </div>

        <div id="reportView" style="display: none">
          <h2>분석 보고서</h2>
          <div id="reportMeta"></div>
          <canvas id="reportCanvas" width="700" height="700"></canvas>
          <pre id="reportDiagnosis"></pre>
          <pre id="reportStrategy"></pre>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="gameAnalysis_syllable.js"></script>
    <script src="app_syllable.js"></script>
  </body>
</html>
