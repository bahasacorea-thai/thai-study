<!doctype html>
<html lang="ko">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RR3ZQXWTWK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-RR3ZQXWTWK");

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>English Stress Trainer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Noto Sans KR",
          sans-serif;
        background: #f5f5f5;
        color: #111;
        overflow: hidden;
      }
      button {
        border: 2px solid #222;
        border-radius: 10px;
        background: #fff;
        padding: 7px 9px;
        font-weight: 700;
        font-size: 14px;
        touch-action: manipulation;
      }
      button.active {
        background: royalblue;
        color: white;
      }
      .setup {
        height: 100dvh;
        padding: max(6px, env(safe-area-inset-top)) 6px max(6px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 6px;
        max-width: 520px;
        margin: 0 auto;
      }
      .setup h1 {
        margin: 0;
        font-size: 13px;
        line-height: 1.1;
      }
      .setupPanel {
        background: white;
        border-radius: 16px;
        padding: 8px;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        overflow: hidden;
      }

      #modeSetupPage {
        display: none;
      }

      body.setup-mode #categorySetupPage {
        display: none;
      }

      body.setup-mode #modeSetupPage {
        display: flex;
      }

      .setupPanel h2 {
        width: 56%;
        margin: 0 auto 1em;
        text-align: center;
        font-size: 19px;
        line-height: 1.2;
      }

      .setupGrid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        min-height: 0;
      }

      .setupGrid button {
        min-height: 48px;
        width: 56%;
        justify-self: center;
        font-size: 19px;
        font-weight: 700;
        padding: 7px 9px;
      }

      .difficultyRow {
        width: 82%;
        justify-self: center;
        display: none;
        gap: 6px;
      }

      .difficultyRow.show {
        display: flex;
      }

      .difficultyBtn {
        flex: 1 1 0;
        min-width: 0;
        width: auto !important;
        min-height: 40px !important;
        margin: 0 !important;
        padding: 0 4px;
        font-size: 14px !important;
        white-space: nowrap;
      }

      .difficultyBtn.beginner {
        background: linear-gradient(145deg, #f3c59c, #b66a38, #e1a170);
        color: #2b1207;
      }

      .difficultyBtn.intermediate {
        background: linear-gradient(145deg, #f5f5f5, #b5b5b5, #ededed);
        color: #222;
      }

      .difficultyBtn.advanced {
        background: linear-gradient(145deg, #fff5b8, #cfa126, #ffe27a);
        color: #3d2a00;
      }

      .setupBack {
        align-self: center;
        min-width: 100px;
        margin-top: 6px;
      }

      .app {
        height: 100dvh;
        padding: max(5px, env(safe-area-inset-top)) 5px max(5px, env(safe-area-inset-bottom));
        display: none;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 5px;
        max-width: 520px;
        margin: 0 auto;
        overflow: hidden;
      }
      body.running .setup {
        display: none;
      }
      body.running .app {
        display: grid;
      }
      .top {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
      }
      .top h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.1;
        text-align: center;
      }
      .top button {
        width: 62px;
        height: 34px;
        padding: 0;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .main {
        min-height: 0;
      }
      .screen {
        display: none;
        height: 100%;
        min-height: 0;
      }
      body.learn #learnScreen,
      body.quiz #quizScreen,
      body.game #gameScreen,
      body.result #resultScreen {
        display: grid;
      }
      .triple {
        gap: 6px;
        /* grid-template-rows: 30% 30% 30%; */
        grid-template-rows: 1fr 1fr 1fr;
      }
      .panel {
        min-height: 0;
        background: white;
        border-radius: 12px;
        padding: 6px 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }
      .wordPanel {
        flex-direction: column;
        gap: 3px;
        font-size: clamp(36px, 13vw, 76px);
        font-weight: 900;
        line-height: 1;
        overflow-wrap: anywhere;
      }
      .ipaText {
        font-family: "Noto Sans", "Charis SIL", "Doulos SIL", system-ui, sans-serif;
        /* font-size: clamp(20px, 6vw, 34px); */
        font-weight: 700;
        line-height: 1.1;
      }
      .infoPanel {
        position: relative;
        flex-direction: column;
        gap: 4px;
        font-size: clamp(16px, 4.8vw, 24px);
        font-weight: 800;
        line-height: 1.2;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }
      .stressLabel {
        font-size: clamp(24px, 8vw, 42px);
        font-weight: 900;
      }
      .hint {
        font-size: clamp(12px, 3.8vw, 17px);
        font-weight: 700;
        color: #444;
        line-height: 1.2;
      }
      #learnDetail {
        font-size: inherit;
        color: #666;
      }
      .learnInfoBlock {
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 0 30px 14px;
        font-size: inherit;
      }
      .learnInfoBlock::before,
      .learnInfoBlock::after {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        font-size: 110px;
        line-height: 1;
        font-weight: 100;
        transform: scaleX(0.25);
        color: #111;
        opacity: 0.1;
        pointer-events: none;
      }
      .learnInfoBlock #learnMorpheme,
      .learnInfoBlock #learnIPA,
      .learnInfoBlock #learnKorean,
      .learnInfoBlock #learnDetail {
        font-size: clamp(18px, 5.4vw, 30.6px);
      }
      .learnInfoBlock::before {
        content: "⟨";
        left: -12px;
      }
      .learnInfoBlock::after {
        content: "⟩";
        right: -12px;
      }
      .progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4px;
        font-size: 12px;
        color: #555;
      }

      .promptPanel {
        flex-direction: column;
        gap: 5px;
        font-size: clamp(24px, 7vw, 40px);
        font-weight: 900;
        line-height: 1.15;
      }
      .feedbackPanel {
        flex-direction: column;
        gap: 3px;
        font-size: clamp(16px, 4.8vw, 24px);
        font-weight: 700;
        line-height: 1.15;
        word-break: keep-all;
      }
      .quizInfoBlock {
        position: relative;
        width: 100%;
        display: none;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 0 30px 14px;
        font-size: clamp(18px, 5.4vw, 30.6px);
      }
      .quizInfoBlock::before,
      .quizInfoBlock::after {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        font-size: 110px;
        line-height: 1;
        font-weight: 100;
        transform: scaleX(0.25);
        color: #111;
        opacity: 0.1;
        pointer-events: none;
      }
      .quizInfoBlock::before {
        content: "⟨";
        left: -12px;
      }
      .quizInfoBlock::after {
        content: "⟩";
        right: -12px;
      }
      .quizNavRow {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #555;
      }
      .quizNavRow button {
        width: 34px;
        height: 24px;
        padding: 0;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1;
      }
      .keyboardPanel {
        padding: 4px;
        flex-direction: column;
        gap: 3px;
      }

      .keyboard {
        width: 100%;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: 1fr;
        gap: 6px;
        align-items: center;
      }

      .keyboard button {
        width: min(100%, 82px);
        aspect-ratio: 1 / 1;
        justify-self: center;
        min-width: 0;
        min-height: 0;
        border-radius: 999px;
        padding: 0 4px;
        font-size: clamp(11px, 3.1vw, 16px);
        line-height: 1.02;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .keyboard button.stress-1 {
        background: #87ceeb;
      }
      .keyboard button.stress-2 {
        background: #90ee90;
        color: #111;
      }
      .keyboard button.stress-3 {
        background: pink;
      }
      .keyboard button.stress-4 {
        /* background: linear-gradient(145deg, #f2f2f2, #cfcfcf, #ececec); */
        background: #d9d9d9;
        color: #111;
      }

      .keyShape {
        width: 20px;
        height: 20px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 5px;
        flex-shrink: 0;
      }

      .keyLabel {
        display: block;
        line-height: 1.02;
        margin-top: 0;
        white-space: nowrap;
      }

      .keyboard button.stress-1 .keyShape {
        color: #783117;
      }
      .keyboard button.stress-2 .keyShape {
        color: #6f116f;
      }
      .keyboard button.stress-3 .keyShape {
        color: #008080;
      }

      .keySub {
        font-size: 0.58em;
        font-weight: 700;
        opacity: 0.75;
        margin-top: 2px;
        white-space: nowrap;
      }

      .resultScreen {
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 6px;
      }
      .resultReportPanel {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        text-align: left;
        gap: 8px;
        padding: 10px;
        overflow: auto;
      }

      .scoreBox {
        width: 100%;
        text-align: center;
        font-size: 18px;
        line-height: 1.35;
        font-weight: 700;
      }

      .scoreLine {
        display: grid;
        grid-template-columns: 1fr 2fr;
        column-gap: 8px;
      }

      .scoreLabel {
        text-align: right;
      }

      .scoreValue {
        text-align: left;
      }
      .wrongList {
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .wrongRow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 14px;
      }

      .wrongLeft {
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
      }

      .wrongRight {
        text-align: right;
        white-space: nowrap;
      }

      .resultButtonsPanel {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 6px;
      }
      .resultButtonsPanel button {
        min-width: 92px;
      }

      #quizInfoWrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex !important;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 30px 84px;
      }

      #quizInfoText {
        display: block;
        font-size: 1em;
        line-height: 1.1;
        font-weight: 700;
        text-align: center;
      }

      #quizAnswerLine {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        text-align: center;
      }

      #prevQuizBtn,
      #nextQuizBtn {
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: absolute;
        bottom: 4px;
        width: 88px;
        min-width: 88px;
        height: 44px;
        padding: 0;
        font-size: 16.5px;
        z-index: 2;
      }

      #prevQuizBtn {
        left: 8px;
      }

      #nextQuizBtn {
        right: 8px;
      }

      #quizInfoWrap.answered #quizInfoText {
        display: none;
      }

      #quizInfoWrap.answered #quizAnswerLine {
        display: flex;
      }

      #quizInfoWrap.answered #prevQuizBtn,
      #quizInfoWrap.answered #nextQuizBtn {
        display: flex;
      }

      #quizIpa,
      #quizDetail {
        font-size: 1.2em;
      }

      #quizDetail {
        color: #666;
      }

      #quizProgress {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        z-index: 1;
      }

      #quizWord {
        font-size: clamp(32px, 11vw, 76px);
        line-height: 1;
        max-width: 92%;
        white-space: nowrap;
        transform-origin: center;
      }

      .clickableWord {
        display: inline-block;
        padding: 0.08em 0.22em;
        border-bottom: 3px solid rgba(0, 102, 255, 0.45);
        border-radius: 10px;
        background: rgba(0, 102, 255, 0.06);
        -webkit-tap-highlight-color: rgba(0, 102, 255, 0.18);
      }

      #gameInfoWrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex !important;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 30px 84px;
      }

      #gameInfoText {
        display: block;
        font-size: 1em;
        line-height: 1.1;
        font-weight: 700;
        text-align: center;
      }

      #gameProgress {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        z-index: 1;
      }

      #gameWord {
        font-size: clamp(32px, 11vw, 76px);
        line-height: 1;
        max-width: 92%;
        white-space: nowrap;
        transform-origin: center;
      }

      #learnWord,
      #quizWord,
      #gameWord {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }

      #gameResultBtn {
        display: none;

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        width: 56%;
        min-height: 48px;
        font-size: 19px;
        font-weight: 700;

        align-items: center;
        justify-content: center;
        text-align: center;
      }

      #gameScreen.gameDone #gameInfoText {
        display: none;
      }

      #gameScreen.gameDone #gameResultBtn {
        display: flex;
      }
    </style>
  </head>
  <body>
    <section class="setup">
      <h1>English Stress Trainer</h1>
      <div id="categorySetupPage" class="setupPanel">
        <h2 id="categorySetupTitle">범주를 선택하세요</h2>

        <div id="categorySetupGrid" class="setupGrid">
          <button id="setupCategoryNeutral">Neutral suffixes</button>
          <button id="setupCategoryTonic">Tonic endings</button>
          <button id="setupCategoryHeavy">Heavy endings</button>
          <button id="setupCategoryLight">Light endings</button>
          <button id="setupCategoryPosttonic">Posttonic suffixes</button>
          <button id="setupCategorySpecial">Special suffixes</button>
        </div>
      </div>

      <div id="modeSetupPage" class="setupPanel">
        <h2 id="setupTitle">모드를 선택하세요</h2>
        <div id="setupGrid" class="setupGrid">
          <button id="setupModeLearn">학습</button>
          <button id="setupModeQuiz">퀴즈</button>
          <div id="quizDifficultyRow" class="difficultyRow">
            <button id="quizDifficultyBeginner" class="difficultyBtn beginner">초급</button>
            <button id="quizDifficultyIntermediate" class="difficultyBtn intermediate">중급</button>
            <button id="quizDifficultyAdvanced" class="difficultyBtn advanced">고급</button>
          </div>
          <button id="setupModeGame">게임</button>
          <div id="gameDifficultyRow" class="difficultyRow">
            <button id="gameDifficultyBeginner" class="difficultyBtn beginner">초급</button>
            <button id="gameDifficultyIntermediate" class="difficultyBtn intermediate">중급</button>
            <button id="gameDifficultyAdvanced" class="difficultyBtn advanced">고급</button>
          </div>
        </div>
        <button id="setupBack" class="setupBack">뒤로</button>
      </div>
    </section>

    <section class="app">
      <div class="top">
        <button id="backBtn" aria-label="처음">←</button>
        <h1 id="screenTitle">영어 강세</h1>
        <button id="nextBtn" aria-label="발음 듣기">🔊</button>
      </div>

      <main class="main">
        <section id="learnScreen" class="screen triple">
          <div class="panel wordPanel">
            <div id="learnWord" class="clickableWord"></div>
          </div>
          <div class="panel infoPanel">
            <div class="learnInfoBlock">
              <div id="learnMorpheme"></div>
              <div id="learnIpa" class="ipaText"></div>
              <div id="learnKorean"></div>
              <div id="learnDetail" class="hint"></div>
            </div>
            <div id="learnProgress" class="progress"></div>
          </div>
          <div class="panel infoPanel">
            <div id="learnStress" class="stressLabel"></div>
            <div id="learnStressKo"></div>
          </div>
        </section>

        <section id="quizScreen" class="screen triple">
          <div class="panel promptPanel">
            <div id="quizWord" class="clickableWord"></div>
          </div>
          <div class="panel feedbackPanel">
            <div id="quizInfoWrap">
              <div id="quizInfoText">강세 유형을 선택하세요.</div>
              <div id="quizAnswerLine">
                <div id="quizMorpheme"></div>
                <div id="quizIpa" class="ipaText"></div>
                <div id="quizKorean"></div>
                <div id="quizDetail" class="hint"></div>
              </div>

              <button id="prevQuizBtn" class="quizNavBtn">이전</button>
              <button id="nextQuizBtn" class="quizNavBtn">다음</button>
              <div id="quizProgress" class="progress"></div>
            </div>
          </div>
          <div class="panel keyboardPanel">
            <div id="quizKeyboard" class="keyboard"></div>
          </div>
        </section>

        <section id="gameScreen" class="screen triple">
          <div class="panel promptPanel">
            <div id="gameWord"></div>
          </div>

          <div class="panel feedbackPanel">
            <div id="gameInfoWrap">
              <div id="gameInfoText">강세 유형을 선택하세요.</div>
              <button id="gameResultBtn">결과 확인</button>
              <div id="gameProgress" class="progress"></div>
            </div>
          </div>

          <div class="panel keyboardPanel">
            <div id="gameKeyboard" class="keyboard"></div>
          </div>
        </section>

        <section id="resultScreen" class="screen resultScreen">
          <div class="panel resultReportPanel">
            <div id="scoreBox" class="scoreBox"></div>
            <div id="wrongList" class="wrongList"></div>
          </div>
          <div class="resultButtonsPanel">
            <button id="restartGame">게임 다시</button>
          </div>
        </section>
      </main>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="app_English_Stress.js"></script>
  </body>
</html>
