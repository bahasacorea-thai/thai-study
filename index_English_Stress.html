<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>English Stress Trainer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Noto Sans KR",
          sans-serif;
        background: #f5f5f5;
        color: #111;
        overflow: hidden;
      }
      button {
        border: 2px solid #222;
        border-radius: 10px;
        background: #fff;
        padding: 7px 9px;
        font-weight: 700;
        font-size: 14px;
        touch-action: manipulation;
      }
      button.active {
        background: royalblue;
        color: white;
      }
      .setup {
        height: 100dvh;
        padding: max(6px, env(safe-area-inset-top)) 6px max(6px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 6px;
        max-width: 520px;
        margin: 0 auto;
      }
      .setup h1 {
        margin: 0;
        font-size: 13px;
        line-height: 1.1;
      }
      .setupPanel {
        background: white;
        border-radius: 16px;
        padding: 8px;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        overflow: hidden;
      }
      .setupPanel h2 {
        margin: 0;
        text-align: center;
        font-size: 13px;
      }
      .setupGrid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        min-height: 0;
      }
      .setupGrid button {
        min-height: 48px;
        width: 56%;
        justify-self: center;
        font-size: 19px;
        font-weight: 700;
        padding: 7px 9px;
      }
      .setupBack {
        align-self: center;
        min-width: 100px;
        margin-top: 6px;
      }

      .app {
        height: 100dvh;
        padding: max(5px, env(safe-area-inset-top)) 5px max(5px, env(safe-area-inset-bottom));
        display: none;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 5px;
        max-width: 520px;
        margin: 0 auto;
        overflow: hidden;
      }
      body.running .setup {
        display: none;
      }
      body.running .app {
        display: grid;
      }
      .top {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
      }
      .top h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.1;
        text-align: center;
      }
      .top button {
        width: 62px;
        height: 34px;
        padding: 0;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .main {
        min-height: 0;
      }
      .screen {
        display: none;
        height: 100%;
        min-height: 0;
      }
      body.learn #learnScreen,
      body.quiz #quizScreen,
      body.game #gameScreen,
      body.result #resultScreen {
        display: grid;
      }
      .triple {
        gap: 6px;
        grid-template-rows: 30% 40% 30%;
      }
      .panel {
        min-height: 0;
        background: white;
        border-radius: 12px;
        padding: 6px 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }
      .wordPanel {
        flex-direction: column;
        gap: 3px;
        font-size: clamp(36px, 13vw, 76px);
        font-weight: 900;
        line-height: 1;
        overflow-wrap: anywhere;
      }
      .ipaText {
        font-family: "Noto Sans", "Charis SIL", "Doulos SIL", system-ui, sans-serif;
        font-size: clamp(20px, 6vw, 34px);
        font-weight: 700;
        line-height: 1.1;
      }
      .infoPanel {
        position: relative;
        flex-direction: column;
        gap: 4px;
        font-size: clamp(16px, 4.8vw, 24px);
        font-weight: 800;
        line-height: 1.2;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }
      .stressLabel {
        font-size: clamp(24px, 8vw, 42px);
        font-weight: 900;
      }
      .hint {
        font-size: clamp(12px, 3.8vw, 17px);
        font-weight: 700;
        color: #444;
        line-height: 1.2;
      }
      .progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4px;
        font-size: 12px;
        color: #555;
      }

      .promptPanel {
        flex-direction: column;
        gap: 5px;
        font-size: clamp(24px, 7vw, 40px);
        font-weight: 900;
        line-height: 1.15;
      }
      .feedbackPanel {
        flex-direction: column;
        gap: 3px;
        font-size: clamp(16px, 4.8vw, 24px);
        font-weight: 700;
        line-height: 1.15;
        word-break: keep-all;
      }
      .keyboardPanel {
        padding: 4px;
        flex-direction: column;
        gap: 3px;
      }
      .keyboard {
        width: 100%;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 5px;
      }
      .keyboard button {
        min-width: 0;
        min-height: 0;
        padding: 0 6px;
        font-size: clamp(18px, 5.8vw, 29px);
        line-height: 1.05;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .keySub {
        font-size: 0.58em;
        font-weight: 700;
        opacity: 0.75;
        margin-top: 2px;
      }
      .resultScreen {
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 6px;
      }
      .resultReportPanel {
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        text-align: left;
        gap: 8px;
        padding: 10px;
        overflow: auto;
      }
      .scoreBox {
        text-align: center;
        font-size: clamp(26px, 9vw, 48px);
        font-weight: 900;
      }
      .wrongList {
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .resultButtonsPanel {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 6px;
      }
      .resultButtonsPanel button {
        min-width: 92px;
      }
    </style>
  </head>
  <body>
    <section class="setup">
      <h1>English Stress Trainer</h1>
      <div class="setupPanel">
        <h2 id="setupTitle">모드를 선택하세요</h2>
        <div id="setupGrid" class="setupGrid">
          <button id="setupModeLearn">학습</button>
          <button id="setupModeQuiz">퀴즈</button>
          <button id="setupModeGame">게임</button>
        </div>
        <button id="setupBack" class="setupBack">뒤로</button>
      </div>
    </section>

    <section class="app">
      <div class="top">
        <button id="backBtn">처음</button>
        <h1 id="screenTitle">영어 강세</h1>
        <button id="nextBtn">다음</button>
      </div>

      <main class="main">
        <section id="learnScreen" class="screen triple">
          <div class="panel wordPanel">
            <div id="learnWord"></div>
            <div id="learnIpa" class="ipaText"></div>
          </div>
          <div class="panel infoPanel">
            <div id="learnStress" class="stressLabel"></div>
            <div id="learnStressKo"></div>
            <div id="learnProgress" class="progress"></div>
          </div>
          <div class="panel infoPanel">
            <div id="learnKorean"></div>
            <div id="learnDetail" class="hint"></div>
          </div>
        </section>

        <section id="quizScreen" class="screen triple">
          <div class="panel promptPanel">
            <div id="quizWord"></div>
            <div id="quizIpa" class="ipaText"></div>
            <div id="quizKorean" class="hint"></div>
          </div>
          <div class="panel feedbackPanel">
            <div id="quizInfoText">강세 유형을 선택하세요.</div>
            <div id="quizAnswerText"></div>
            <div id="quizProgress" class="progress"></div>
          </div>
          <div class="panel keyboardPanel">
            <div id="quizKeyboard" class="keyboard"></div>
          </div>
        </section>

        <section id="gameScreen" class="screen triple">
          <div class="panel promptPanel">
            <div id="gameWord"></div>
            <div id="gameIpa" class="ipaText"></div>
            <div id="gameKorean" class="hint"></div>
          </div>
          <div class="panel feedbackPanel">
            <div id="gameInfoText">강세 유형을 선택하세요.</div>
            <div id="gameProgress" class="progress"></div>
          </div>
          <div class="panel keyboardPanel">
            <div id="gameKeyboard" class="keyboard"></div>
          </div>
        </section>

        <section id="resultScreen" class="screen resultScreen">
          <div class="panel resultReportPanel">
            <div id="scoreBox" class="scoreBox"></div>
            <div id="wrongList" class="wrongList"></div>
          </div>
          <div class="resultButtonsPanel">
            <button id="restartGame">다시</button>
            <button id="resultHome">처음</button>
          </div>
        </section>
      </main>
    </section>

    <script src="app_English_Stress.js"></script>
  </body>
</html>
