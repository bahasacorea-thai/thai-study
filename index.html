[6. 절대 유지 원칙
===============================================================================

1. 모든 비율 계산 기준은 panel distributable area 750px이다.

2. Main 758px 중 8px은 두 개의 4px panel gap이다.

3. percentage track 합계 100%에 gap을 추가하여 overflow를 만들지 않는다.

4. Quiz / Game:
       25 : 25 : 50
       = 187.5 : 187.5 : 375

5. Learn:
       245 : 260 : 245
       = 32.67 : 34.67 : 32.67

6. Thai : Korean : RTGS 글자 크기:
       50 : 25 : 25
       = 2 : 1 : 1

7. Quiz/Game keyboard:
       4 columns × 4 rows
       16 slots/page
       key = 75 × 75px
       glyph = 50px
       padding = 0

8. 320×800 기준에서는 Key 75 × 75px을 유지한다.
   실제 viewport 높이가 기준보다 작으면 750px 패널 배분 공간을 기준으로
   내부 key / glyph / image / text를 동일 배율로 축소한다.

9. 모든 텍스트와 버튼 내용은 자신에게 할당된 공간 안에서
   수직 중앙 정렬한다.

10. 기본 수평 정렬도 중앙이다.
    여러 버튼은 필요한 경우 동일 간격으로 분배한다.

11. Thai glyph의 위/아래 결합부호가 절대로 clipping되지 않아야 한다.

12. Learn 하단:
       panel = 245px
       image max-height = 225px
       top/bottom remaining space = 10px + 10px

13. Learn 상단:
       LEFT   = stroke-order animation
       CENTER = font character
       RIGHT  = touch tracing outline
       기준 문자 크기 = 112.5px

14. 실제 구현에서는 고정 320×800만을 강제하지 않는다.
    320×800은 기준 설계값이다.
    실제 viewport의 사용 가능 공간에서 동일한 비율 원칙을 유지한다.
    내부 UI scale = min(1, viewportWidth / 320, (viewportHeight - 50) / 750).
    여기서 50px = App 상하 padding 8 + Header 30 + Header/Main gap 4 + panel gap 8.
===============================================================================
*/

      :root {
        --ui-scale: 1;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Noto Sans KR",
          sans-serif;
        background: #f5f5f5;
        color: #111;
        overflow: hidden;
      }
      button {
        border: 2px solid #222;
        border-radius: 10px;
        background: #fff;
        padding: 7px 9px;
        font-weight: 500;
        font-size: 14px;
      }
      button.active {
        background: royalblue;
        color: white;
      }
      button.mode-active {
        background: red;
        color: white;
      }

      .setup {
        height: 100dvh;
        padding: max(6px, env(safe-area-inset-top)) 6px max(6px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 6px;
        max-width: 520px;
        margin: 0 auto;
      }
      .setup h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.1;
        text-align: center;
      }

      .setupPanel {
        background: white;
        border-radius: 16px;
        padding: 8px;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .setupPanel h2 {
        width: 100%;
        margin: 0 auto 4px;
        text-align: center;
        font-size: 19px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .setupSelectionNotice {
        width: 100%;
        margin: 0 auto 12px;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        color: #555;
      }

      .setupGrid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        min-height: 0;
      }

      .setupGrid button {
        min-height: 48px;
        width: min(86%, 320px);
        justify-self: center;
        font-size: 19px;
        font-weight: 500;
        padding: 7px 10px;
      }

      .setupBack {
        align-self: center;
        min-width: 100px;
        margin-top: 16px;
      }

      .app {
        height: 100dvh;
        padding: 4px 0;
        display: none;
        grid-template-rows: 30px minmax(0, 1fr);
        gap: 4px;
        max-width: 520px;
        margin: 0 auto;
        overflow: hidden;
      }

      body.running .setup {
        display: none;
      }
      body.running .app {
        display: grid;
      }

      .top {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
      }
      .top h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.1;
        text-align: center;
      }
      .top button {
        width: 62px;
        height: 34px;
        padding: 0;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main {
        min-height: 0;
      }
      .screen {
        display: none;
        height: 100%;
        min-height: 0;
      }
      body.learn #learnScreen,
      body.quiz #quizScreen,
      body.game #gameScreen {
        display: grid;
      }

      .triple {
        gap: 4px;
      }

      #learnScreen {
        grid-template-rows:
          minmax(0, 49fr)
          minmax(0, 52fr)
          minmax(0, 49fr);
      }

      #quizScreen,
      #gameScreen {
        grid-template-rows:
          minmax(0, 1fr)
          minmax(0, 1fr)
          minmax(0, 2fr);
      }

      .panel {
        min-height: 0;
        background: white;
        border-radius: calc(12px * var(--ui-scale));
        padding: calc(4px * var(--ui-scale));
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }

      .symbolPanel {
        font-family: "Noto Sans Thai", Tahoma, "Leelawadee UI", sans-serif;
        font-size: calc(112.5px * var(--ui-scale));
        font-weight: 500;
        line-height: 1;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .infoPanel {
        position: relative;
        display: grid;
        grid-template-rows:
          2.5fr
          70fr
          2.5fr
          35fr
          2.5fr
          35fr
          2.5fr
          70fr
          2.5fr
          35fr
          2.5fr;
        padding: 0;
        gap: 0;
        font-weight: 700;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }

      #learnThaiName,
      #learnKoreanName,
      #learnRtgsName,
      #learnHint,
      #learnProgress {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        font-weight: 700;
        line-height: 1;
      }

      #learnThaiName {
        line-height: 1.3;
      }

      #learnThaiName {
        grid-row: 2;
        font-size: calc(50px * var(--ui-scale));
      }

      #learnKoreanName {
        grid-row: 4;
        font-size: calc(25px * var(--ui-scale));
      }

      #learnRtgsName {
        grid-row: 6;
        font-size: calc(25px * var(--ui-scale));
      }

      #learnHint {
        grid-row: 8;
        font-size: calc(25px * var(--ui-scale));
        color: #444;
      }

      #learnProgress {
        grid-row: 10;
        position: static;
        font-size: calc(16px * var(--ui-scale));
      }

      .numberMeaningBlock,
      .numberQuizPrompt {
        font-size: calc(112.5px * var(--ui-scale));
        line-height: 1;
      }

      .extraPanel {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .extraPanel img {
        max-width: 100%;
        max-height: calc(225px * var(--ui-scale));
        object-fit: contain;
      }

      .punctuationMeaningBlock {
        font-size: 2em;
        line-height: 1.3;
        text-align: center;
      }

      .promptPanel {
        flex-direction: column;
        gap: calc(3px * var(--ui-scale));
        font-size: clamp(calc(22px * var(--ui-scale)), 6.4vw, calc(34px * var(--ui-scale)));
        font-weight: 800;
        line-height: 1.12;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }

      .feedbackPanel {
        flex-direction: column;
        gap: calc(2px * var(--ui-scale));
        font-size: clamp(calc(16px * var(--ui-scale)), 4.8vw, calc(24px * var(--ui-scale)));
        font-weight: 500;
        line-height: 1;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }

      .keyboardPanel {
        padding: calc(16px * var(--ui-scale)) 0 0;
        display: grid;
        grid-template-rows: calc(300px * var(--ui-scale)) calc(75px * var(--ui-scale));
        min-height: 0;
        overflow: hidden;
      }

      .keyboard {
        width: 108%;
        height: calc(300px * var(--ui-scale));
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: repeat(4, calc(108px * var(--ui-scale)));
        grid-template-rows: repeat(4, calc(75px * var(--ui-scale)));
        justify-content: center;
        align-content: start;
        row-gap: calc(4px * var(--ui-scale));
        column-gap: calc(4px * var(--ui-scale));
      }

      .keyboard button {
        width: calc(108px * var(--ui-scale));
        height: calc(75px * var(--ui-scale));
        padding: 0;
        font-size: calc(50px * var(--ui-scale));
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        justify-self: center;
      }

      .keyboard button.empty {
        opacity: 0.16;
        pointer-events: none;
      }

      .keyboard button.wideKey {
        grid-column: span 2;
        width: 100%;
      }

      .pageInfo {
        width: 100%;
        height: calc(75px * var(--ui-scale));
        min-height: 0;
        font-size: calc(15px * var(--ui-scale));
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #showGameResultBtn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

        width: auto;
        min-width: 0;
        height: 2em;
        padding: 0 1em;

        font-size: clamp(calc(22px * var(--ui-scale)), 6.4vw, calc(34px * var(--ui-scale)));
        line-height: 1;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      body.result #resultScreen {
        display: grid;
      }

      .resultScreen {
        display: none;
        position: relative;
        height: 100%;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .resultScreen.resultScatter .resultTopPanel {
        display: flex;
      }

      .resultScreen.resultScatter .resultReportPanel {
        display: none;
      }

      .resultScreen.resultScatter #saveReportBtn {
        display: none;
      }

      .resultScreen.resultAnalysis .resultTopPanel {
        display: none;
      }

      .resultScreen.resultAnalysis .resultReportPanel {
        display: flex;
      }

      .resultScreen.resultAnalysis #saveReportBtn {
        display: inline-block;
      }

      .resultButtonsPanel {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 6px;
      }

      .resultButtonsPanel button {
        min-width: 92px;
      }

      .resultTopPanel {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-evenly;
        align-content: center;
        align-items: center;
      }

      .resultReportPanel {
        position: relative;
        flex-direction: column;
      }

      .resultSymbol {
        font-family: "Noto Sans Thai", Tahoma, "Leelawadee UI", sans-serif;
        font-size: 36px;
        font-weight: 700;
        line-height: 1;
      }

      .axisLabel {
        font-size: inherit;
        font-weight: 700;
        color: #444;
      }

      .stimulusWrap,
      .responseWrap {
        font-size: calc(16px * var(--ui-scale));
        margin: 0 0 6px 0;
      }

      .resultSwipeHint {
        position: absolute;
        top: 50%;
        transform: translateY(-50%) scaleX(0.25);
        font-size: 110px;
        line-height: 1;
        font-weight: 100;
        color: #111;
        opacity: 0.1;
        pointer-events: none;
        z-index: 5;
      }

      .resultSwipeHint.right {
        right: -18px;
      }

      .resultSwipeHint.left {
        left: -18px;
      }

      #resultCanvas {
        align-self: center;
        width: min(100%, calc(100dvh - 210px));
        aspect-ratio: 1 / 1;
        background: white;
        border-radius: 12px;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        flex-basis: 100%;
      }

      #analysisText {
        flex: 1;
        min-height: 0;
        font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        color: #222;
        overflow-y: auto;
        padding: 6px 4px;
      }

      .difficultyRow {
        width: 82%;
        justify-self: center;

        display: flex;
        gap: 6px;
      }

      .difficultyBtn {
        flex: 1 1 0;
        min-width: 0;
        width: auto !important;
        min-height: 40px !important;

        margin: 0 !important;
        padding: 0 4px;

        font-size: 14px !important;
        white-space: nowrap;
      }

      .difficultyBtn.beginner {
        background: linear-gradient(145deg, #f3c59c, #b66a38, #e1a170);
        color: #2b1207;
      }

      .difficultyBtn.intermediate {
        background: linear-gradient(145deg, #f5f5f5, #b5b5b5, #ededed);
        color: #222;
      }

      .difficultyBtn.advanced {
        background: linear-gradient(145deg, #fff5b8, #cfa126, #ffe27a);
        color: #3d2a00;
      }

      .quizInfoWrap,
      .quizAnswerWrap,
      .gameEndWrap {
        width: 100%;
        height: 100%;
        position: relative;

        display: grid;
        grid-template-rows:
          2.5fr
          70fr
          2.5fr
          35fr
          2.5fr
          35fr
          2.5fr
          35fr
          2.5fr;

        padding: 0;
        gap: 0;
        align-items: center;
        justify-items: center;
      }

      #quizInfoText,
      #gameInfoText {
        grid-row: 2 / 7;
        align-self: center;
        justify-self: center;

        line-height: 1.3;
        text-align: center;
      }

      #quizProgress,
      #quizAnswerProgress,
      #gameProgress {
        grid-row: 8;
        width: 100%;
        height: 100%;
        min-height: 0;

        position: static;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: calc(16px * var(--ui-scale));
        line-height: 1.3;
        font-weight: 700;
        color: #555;
        text-align: center;
      }

      #quizThaiName {
        grid-row: 2;
        font-size: calc(50px * var(--ui-scale));
        line-height: 1.3;
      }

      #quizKoreanName {
        grid-row: 4;
        font-size: calc(25px * var(--ui-scale));
        line-height: 1.3;
      }

      body.quiz.punctuation #quizThaiName {
        font-size: calc(37.5px * var(--ui-scale));
      }

      body.quiz.punctuation #quizKoreanName {
        font-size: calc(18.75px * var(--ui-scale));
      }

      #quizRtgsName {
        grid-row: 6;
        font-size: calc(25px * var(--ui-scale));
        line-height: 1.3;
      }

      .quizPromptWrap {
        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        gap: calc(4px * var(--ui-scale));
        position: relative;

        text-align: center;
        font-weight: 900;
        line-height: 1.35;
      }

      .quizPromptImage {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: contain;
        opacity: 0.32;
        pointer-events: none;
      }

      .quizPromptMeaningSub {
        color: #666;
      }

      .quizPromptWrap > div {
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-align: center;
        word-break: keep-all;
      }

      .quizAnswerWrap > div {
        width: 100%;
        min-height: 0;
        padding: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        white-space: nowrap;
        text-align: center;
        overflow-x: hidden;
        overflow-y: visible;
        font-weight: inherit;
      }

      .quizNavBtn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);

        width: calc(84px * var(--ui-scale));
        min-width: calc(84px * var(--ui-scale));
        height: calc(35px * var(--ui-scale));

        font-size: calc(16px * var(--ui-scale));
        padding: 0;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      #prevQuizBtn {
        left: calc(4px * var(--ui-scale));
      }

      #nextQuizBtn {
        right: calc(4px * var(--ui-scale));
      }

      @media (max-width: 359px), (max-height: 700px) {
        button {
          border-width: 1.5px;
          border-radius: 8px;
        }

        .top {
          gap: 4px;
        }

        .top h1 {
          font-size: 14px;
        }

        .top button {
          width: 54px;
          height: 30px;
          font-size: calc(16px * var(--ui-scale));
        }
      }
    </style>
  </head>
  <body class="learn">
    <section id="setup" class="setup">
      <h1>태국어 문자</h1>
      <div class="setupPanel">
        <div id="setupSelectionNotice" class="setupSelectionNotice" style="display: none"></div>
        <h2 id="setupTitle">범주를 선택하세요</h2>
        <div id="setupGrid" class="setupGrid">
          <button id="setupCategoryConsonant1">자음1</button>
          <button id="setupCategoryConsonant2">자음2</button>
          <button id="setupCategoryConsonantAll">자음전체</button>
          <button id="setupCategoryVowelPlus">모음+</button>
          <button id="setupCategoryNumber">숫자</button>
          <button id="setupCategoryPunctuation">문장부호</button>

          <button id="setupModeLearn" style="display: none">학습</button>
          <button id="setupModeQuiz" style="display: none">퀴즈</button>

          <div id="quizDifficultyRow" class="difficultyRow" style="display: none">
            <button id="quizDifficultyBeginner" class="difficultyBtn beginner">초급</button>
            <button id="quizDifficultyIntermediate" class="difficultyBtn intermediate">중급</button>
            <button id="quizDifficultyAdvanced" class="difficultyBtn advanced">고급</button>
          </div>

          <button id="setupModeGame" style="display: none">게임</button>

          <div id="gameDifficultyRow" class="difficultyRow" style="display: none">
            <button id="gameDifficultyBeginner" class="difficultyBtn beginner">초급</button>
            <button id="gameDifficultyIntermediate" class="difficultyBtn intermediate">중급</button>
            <button id="gameDifficultyAdvanced" class="difficultyBtn advanced">고급</button>
          </div>
        </div>
        <button id="setupBack" class="setupBack" style="display: none">이전</button>
      </div>
    </section>

    <div class="app">
      <header class="top">
        <button id="backBtn">⟵</button>
        <h1 id="screenTitle">태국어 문자</h1>
        <button id="speakBtn">🔊</button>
      </header>

      <main class="main">
        <section id="learnScreen" class="screen triple">
          <div id="learnSymbol" class="panel symbolPanel">
            <div id="learnStrokeDemo" class="learnSymbolSlot learnStrokeDemo">
              <svg id="learnStrokeSvg" class="learnStrokeSvg" viewBox="0 0 120 120" aria-label="필순 애니메이션"></svg>
            </div>

            <div id="learnSymbolFont" class="learnSymbolSlot learnSymbolFont" aria-label="기준 문자"></div>

            <div id="learnTraceArea" class="learnSymbolSlot learnTraceArea">
              <svg id="learnTraceSvg" class="learnTraceSvg" viewBox="0 0 120 120" aria-label="따라쓰기"></svg>
            </div>
          </div>
          <div id="learnInfo" class="panel infoPanel">
            <div id="learnThaiName"></div>
            <div id="learnKoreanName"></div>
            <div id="learnRtgsName"></div>
            <div id="learnHint" class="hint"></div>
            <div id="learnProgress" class="quizProgress"></div>
          </div>
          <div id="learnExtra" class="panel extraPanel">
            <img id="learnImage" style="display: none" />

            <div id="learnMeaning"></div>
          </div>
        </section>

        <section id="quizScreen" class="screen triple">
          <div id="quizPrompt" class="panel promptPanel">
            <div id="quizPromptWrap" class="quizPromptWrap">
              <img id="quizPromptImage" class="quizPromptImage" style="display: none" />

              <div id="quizPromptKorean"></div>
              <div id="quizPromptRtgs"></div>
              <div id="quizPromptMeaning"></div>
            </div>
          </div>
          <div id="quizInfo" class="panel feedbackPanel">
            <div id="quizInfoWrap" class="quizInfoWrap" style="display: none">
              <div id="quizInfoText"></div>
              <div id="quizProgress" class="quizProgress"></div>
            </div>

            <div id="quizAnswerWrap" class="quizAnswerWrap" style="display: none">
              <div id="quizThaiName"></div>
              <div id="quizKoreanName"></div>
              <div id="quizRtgsName"></div>

              <div id="quizAnswerProgress" class="quizProgress"></div>

              <button id="prevQuizBtn" class="quizNavBtn">이전</button>

              <button id="nextQuizBtn" class="quizNavBtn">다음</button>
            </div>
          </div>
          <div class="panel keyboardPanel">
            <div id="quizKeyboard" class="keyboard">
              <button></button>
              <button></button>
              <button></button>
              <button></button>

              <button></button>
              <button></button>
              <button></button>
              <button></button>

              <button></button>
              <button></button>
              <button></button>
              <button></button>
            </div>
            <div id="quizPageInfo" class="pageInfo"></div>
          </div>
        </section>

        <section id="gameScreen" class="screen triple">
          <div id="gamePrompt" class="panel promptPanel">
            <div id="gamePromptWrap" class="quizPromptWrap">
              <img id="gamePromptImage" class="quizPromptImage" style="display: none" />
              <div id="gamePromptKorean"></div>
              <div id="gamePromptRtgs"></div>
              <div id="gamePromptMeaning"></div>
            </div>
          </div>
          <div id="gameInfo" class="panel feedbackPanel">
            <div id="gameEndWrap" class="gameEndWrap">
              <div id="gameInfoText"></div>
              <div id="gameProgress" class="quizProgress"></div>
              <button id="showGameResultBtn" style="display: none">결과 확인</button>
            </div>
          </div>
          <div class="panel keyboardPanel">
            <div id="gameKeyboard" class="keyboard"></div>
            <div id="gamePageInfo" class="pageInfo"></div>
          </div>
        </section>

        <section id="resultScreen" class="screen resultScreen">
          <div class="panel resultTopPanel">
            <div class="stimulusWrap">
              <span class="axisLabel">자극:</span>
              <span id="stimulusSymbol" class="resultSymbol"></span>
            </div>

            <div class="responseWrap">
              <span class="axisLabel">반응:</span>
              <span id="responseSymbol" class="resultSymbol"></span>
            </div>

            <canvas id="resultCanvas" width="720" height="720"></canvas>
            <div id="resultSwipeRight" class="resultSwipeHint right">⟩</div>
          </div>

          <div class="panel resultReportPanel">
            <div id="analysisText"></div>
            <div id="resultSwipeLeft" class="resultSwipeHint left">⟨</div>
          </div>

          <div class="panel resultButtonsPanel">
            <button id="saveReportBtn">분석보고서 저장</button>
            <button id="restartBtn">게임 다시</button>
          </div>
        </section>
      </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="gameAnalysis.js"></script>
    <script src="app.js"></script>
  </body>
