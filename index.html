<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thai Study Mobile</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Noto Sans KR",
          sans-serif;
        background: #f5f5f5;
        color: #111;
        overflow: hidden;
      }
      button {
        border: 2px solid #222;
        border-radius: 12px;
        background: #fff;
        padding: 10px 12px;
        font-weight: 800;
        font-size: 16px;
      }
      button.active {
        background: royalblue;
        color: white;
      }
      button.mode-active {
        background: red;
        color: white;
      }

      .setup {
        height: 100dvh;
        padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 14px;
        max-width: 520px;
        margin: 0 auto;
      }
      .setup h1 {
        margin: 0;
        font-size: 24px;
      }
      .setupPanel {
        background: white;
        border-radius: 22px;
        padding: 18px;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }
      .setupPanel h2 {
        margin: 0;
        text-align: center;
        font-size: 22px;
      }
      .setupGrid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .setupGrid button {
        min-height: 72px;
        width: 50%;
        justify-self: center;

        font-size: 24px;
        font-weight: 800;

        padding: 14px 16px;
      }
      .setupBack {
        align-self: center;
        min-width: 120px;
        margin-top: 24px;
      }

      .app {
        height: 100dvh;
        padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
        display: none;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 8px;
        max-width: 520px;
        margin: 0 auto;
      }
      body.running .setup {
        display: none;
      }
      body.running .app {
        display: grid;
      }

      .top {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 8px;
      }
      .top h1 {
        margin: 0;
        font-size: 20px;
        text-align: center;
      }
      .top button {
        width: 88px;
        height: 52px;
        padding: 0;
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .main {
        min-height: 0;
      }
      .screen {
        display: none;
        height: 100%;
        min-height: 0;
      }
      body.learn #learnScreen,
      body.quiz #quizScreen,
      body.game #gameScreen {
        display: grid;
      }

      .triple {
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .panel {
        min-height: 0;
        background: white;
        border-radius: 18px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }
      .symbolPanel {
        font-family: "Noto Sans Thai", Tahoma, "Leelawadee UI", sans-serif;
        font-size: clamp(64px, 22vw, 136px);
        font-weight: 800;
        line-height: 1;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .infoPanel,
      .extraPanel,
      .promptPanel,
      .feedbackPanel {
        flex-direction: column;
        gap: 6px;
        font-size: clamp(18px, 5vw, 28px);
        font-weight: 800;
        line-height: 1.25;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }
      .extraPanel img {
        max-width: 100%;
        max-height: calc(100% - 36px);
        object-fit: contain;
      }
      .hint {
        font-size: clamp(13px, 3.6vw, 17px);
        font-weight: 700;
        color: #444;
        line-height: 1.35;
      }
      .keyboardPanel {
        padding: 8px;
        flex-direction: column;
        gap: 6px;
      }
      .keyboard {
        width: 100%;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .keyboard button {
        min-width: 0;
        min-height: 0;
        padding: 0 4px;
        font-family: "Noto Sans Thai", Tahoma, "Leelawadee UI", sans-serif;
        font-size: clamp(24px, 8vw, 40px);
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .keyboard button.empty {
        opacity: 0.16;
        pointer-events: none;
      }
      .pageInfo {
        font-size: 13px;
        font-weight: 800;
        color: #555;
      }
      .progressText {
        font-size: clamp(20px, 6vw, 32px);
        font-weight: 900;
      }
      body.result #resultScreen {
        display: grid;
      }

      .resultScreen {
        display: none;
        height: 100%;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .resultTopPanel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        padding: 8px;
      }

      .resultSideBox {
        text-align: center;
      }

      .sideTitle {
        font-size: 16px;
        font-weight: 800;
        color: #555;
      }

      .resultSymbol {
        font-family: "Noto Sans Thai", Tahoma, "Leelawadee UI", sans-serif;
        font-size: 52px;
        font-weight: 900;
        line-height: 1;
      }

      .axisLabel {
        font-size: inherit;
        font-weight: 800;
        color: #444;
      }

      .stimulusWrap {
        font-size: 28px;
        margin-bottom: 16px;
      }
      .responseWrap {
        font-size: 28px;
        margin-top: 16px;
      }

      #resultCanvas {
        align-self: center;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: white;
        border-radius: 12px;
        touch-action: none;
      }

      .resultBottomPanel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: hidden;
      }

      #analysisText {
        font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
        font-size: 15px;
        line-height: 1.65;
        white-space: pre-wrap;
        color: #222;
        overflow-y: auto;
      }

      .resultButtons {
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .resultButtons button {
        min-width: 120px;
      }

      .difficultyBtn {
        width: 28% !important;
        justify-self: center;
        margin-left: 32%;
        min-height: 58px !important;
        font-size: 20px !important;
      }
    </style>
  </head>
  <body class="learn">
    <section id="setup" class="setup">
      <h1>태국어 문자 학습</h1>
      <div class="setupPanel">
        <h2 id="setupTitle">범주를 선택하세요</h2>
        <div id="setupGrid" class="setupGrid"></div>
        <button id="setupBack" class="setupBack" style="display: none">이전</button>
      </div>
    </section>

    <div class="app">
      <header class="top">
        <button id="backBtn">⟵</button>
        <h1 id="screenTitle">태국어 문자 학습</h1>
        <button id="speakBtn">🔊</button>
      </header>

      <main class="main">
        <section id="learnScreen" class="screen triple">
          <div id="learnSymbol" class="panel symbolPanel"></div>
          <div id="learnInfo" class="panel infoPanel"></div>
          <div id="learnExtra" class="panel extraPanel"></div>
        </section>

        <section id="quizScreen" class="screen triple">
          <div id="quizPrompt" class="panel promptPanel"></div>
          <div id="quizInfo" class="panel feedbackPanel"></div>
          <div class="panel keyboardPanel">
            <div id="quizKeyboard" class="keyboard"></div>
            <div id="quizPageInfo" class="pageInfo"></div>
          </div>
        </section>

        <section id="gameScreen" class="screen triple">
          <div id="gamePrompt" class="panel promptPanel"></div>
          <div id="gameInfo" class="panel feedbackPanel"></div>
          <div class="panel keyboardPanel">
            <div id="gameKeyboard" class="keyboard"></div>
            <div id="gamePageInfo" class="pageInfo"></div>
          </div>
        </section>

        <section id="resultScreen" class="screen resultScreen">
          <div class="panel resultTopPanel">
            <div class="stimulusWrap">
              <span class="axisLabel">자극:</span>
              <span id="stimulusSymbol" class="resultSymbol"></span>
            </div>

            <canvas id="resultCanvas" width="720" height="720"></canvas>

            <div class="responseWrap">
              <span class="axisLabel">반응:</span>
              <span id="responseSymbol" class="resultSymbol"></span>
            </div>
          </div>

          <div class="panel resultBottomPanel">
            <div id="analysisText"></div>

            <div class="resultButtons">
              <button id="saveReportBtn" style="display: none">분석보고서 저장</button>
              <button id="restartGame">게임 다시</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="gameAnalysis.js"></script>
    <script src="app.js"></script>
  </body>
</html>
